services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paulo_investimentos_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STREAMLIT_PORT:-8502}:${STREAMLIT_PORT:-8502}"
    env_file:
      - .env
    environment:
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8502}
      - STREAMLIT_SERVER_PORT=${STREAMLIT_PORT:-8502}
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - TZ=America/Campo_Grande
      - HOST_IP=${HOST_IP:-localhost}
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./src:/app/src:ro
      - ./dashboard.py:/app/dashboard.py:ro
      - ./assets:/app/assets:ro
      - ./.streamlit:/app/.streamlit:ro
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${STREAMLIT_PORT:-8502}/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s





